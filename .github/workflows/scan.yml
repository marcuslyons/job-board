name: scan

on:
  schedule:
    - cron: "0 13 * * *" # 06:00 Mountain
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The classifier decides what the board shows and fails silently, so it
      # gates the scan rather than running after it.
      - run: python3 test_jobscan.py

      - run: python3 jobscan.py --json > static/data/jobs.json

      # A board shape change can return an empty list without erroring. Refuse to
      # commit a file that would blank the site.
      - name: Sanity check the scan
        run: |
          count=$(python3 -c "import json;print(len(json.load(open('static/data/jobs.json'))['jobs']))")
          echo "scanned $count postings"
          [ "$count" -gt 2000 ] || { echo "too few postings, not committing"; exit 1; }

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/jobs.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "chore(data): daily scan"
          git push
